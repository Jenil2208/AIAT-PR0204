<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resume — Frontend</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 id="name">Your Name</h1>
      <p class="role" id="role">Frontend Developer</p>
      <p class="summary" id="summary">Creative frontend developer building accessible, responsive interfaces.</p>
      <p class="contact" id="contact"></p>
    </div>
  </header>

  <main class="container">
    <section>
      <h2>Experience</h2>
      <div id="experience"></div>
    </section>

    <section>
      <h2>Projects</h2>
      <div id="projects"></div>
    </section>

    <section>
      <h2>Skills</h2>
      <p class="skills" id="skills"></p>
    </section>

    <section>
      <h2>Education</h2>
      <div id="education"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="copyright"></p>
    </div>
  </footer>

  <noscript>Please enable JavaScript to view this resume properly.</noscript>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
